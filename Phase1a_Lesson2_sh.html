<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1a Lesson 2: sh bridge</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .digraph { color: #e74c3c; font-weight: bold; }
  .vowel { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 1a • Lesson 2</h1>
  <h2>More sh + CVC</h2>
  <p style="text-align:center;">Red = digraph or short vowel.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('shell')"><span class="digraph">sh</span><span class="p1">ell</span></div>
    <div class="word" onclick="speak('pet')"><span class="p1">p</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('wish')"><span class="p1">wi</span><span class="digraph">sh</span></div>
    <div class="word" onclick="speak('big')"><span class="p1">b</span><span class="vowel">i</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('bush')"><span class="p1">bu</span><span class="digraph">sh</span></div>
    <div class="word" onclick="speak('run')"><span class="p1">r</span><span class="vowel">u</span><span class="p2">n</span></div>
  </div>
  <h2>Story: The Shell</h2>
  <div class="story">
    <p><span class="p1">I found a pretty </span><span class="digraph">sh</span><span class="p2">ell</span><span class="p1">.</span></p>
    <button onclick="speak('I found a pretty shell.')">Hear sentence 1</button>
    <p><span class="p2">My </span><span class="p1">p</span><span class="vowel">e</span><span class="p2">t</span><span class="p1"> is a small cat.</span></p>
    <button onclick="speak('My pet is a small cat.')">Hear sentence 2</button>
    <p><span class="p1">Make a </span><span class="p2">wi</span><span class="digraph">sh</span><span class="p1">.</span></p>
    <button onclick="speak('Make a wish.')">Hear sentence 3</button>
    <p><span class="p2">The </span><span class="p1">b</span><span class="vowel">i</span><span class="p2">g</span><span class="p1"> dog likes to run.</span></p>
    <button onclick="speak('The big dog likes to run.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the digraph or short vowel. Gentle mix of CVC and sh.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
