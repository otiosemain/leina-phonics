<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 Lesson 11: -et family</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .vowel { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 1 • Lesson 11</h1>
  <h2>-et family</h2>
  <p style="text-align:center;">Red = short e.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('pet')"><span class="p1">p</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('net')"><span class="p1">n</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('wet')"><span class="p1">w</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('get')"><span class="p1">g</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('let')"><span class="p1">l</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('met')"><span class="p1">m</span><span class="vowel">e</span><span class="p2">t</span></div>
  </div>
  <h2>Story: The Pet</h2>
  <div class="story">
    <p><span class="p1">We have a small </span><span class="p1">p</span><span class="vowel">e</span><span class="p2">t</span><span class="p1"> cat.</span></p>
    <button onclick="speak('We have a small pet cat.')">Hear sentence 1</button>
    <p><span class="p2">The fish swam in the </span><span class="p1">n</span><span class="vowel">e</span><span class="p2">t</span><span class="p1">.</span></p>
    <button onclick="speak('The fish swam in the net.')">Hear sentence 2</button>
    <p><span class="p1">Do not get the book </span><span class="p1">w</span><span class="vowel">e</span><span class="p2">t</span><span class="p1">.</span></p>
    <button onclick="speak('Do not get the book wet.')">Hear sentence 3</button>
    <p><span class="p2">Please </span><span class="p1">g</span><span class="vowel">e</span><span class="p2">t</span><span class="p1"> your bag ready.</span></p>
    <button onclick="speak('Please get your bag ready.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the short vowel. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
