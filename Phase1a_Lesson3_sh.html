<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1a Lesson 3: sh bridge</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .digraph { color: #e74c3c; font-weight: bold; }
  .vowel { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 1a • Lesson 3</h1>
  <h2>sh practice with CVC</h2>
  <p style="text-align:center;">Red = digraph or short vowel.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('ship')"><span class="digraph">sh</span><span class="p1">ip</span></div>
    <div class="word" onclick="speak('cap')"><span class="p1">c</span><span class="vowel">a</span><span class="p2">p</span></div>
    <div class="word" onclick="speak('shop')"><span class="digraph">sh</span><span class="p2">op</span></div>
    <div class="word" onclick="speak('net')"><span class="p1">n</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('fish')"><span class="p1">fi</span><span class="digraph">sh</span></div>
    <div class="word" onclick="speak('hop')"><span class="p1">h</span><span class="vowel">o</span><span class="p2">p</span></div>
  </div>
  <h2>Story: At the Shop</h2>
  <div class="story">
    <p><span class="p1">We saw a big </span><span class="digraph">sh</span><span class="p2">ip</span><span class="p1">.</span></p>
    <button onclick="speak('We saw a big ship.')">Hear sentence 1</button>
    <p><span class="p2">Dad has a red </span><span class="p1">c</span><span class="vowel">a</span><span class="p2">p</span><span class="p1">.</span></p>
    <button onclick="speak('Dad has a red cap.')">Hear sentence 2</button>
    <p><span class="p1">The </span><span class="digraph">sh</span><span class="p2">op</span><span class="p1"> sells fish.</span></p>
    <button onclick="speak('The shop sells fish.')">Hear sentence 3</button>
    <p><span class="p2">The rabbit can </span><span class="p1">h</span><span class="vowel">o</span><span class="p2">p</span><span class="p1">.</span></p>
    <button onclick="speak('The rabbit can hop.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the digraph or short vowel. Building confidence with sh.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
