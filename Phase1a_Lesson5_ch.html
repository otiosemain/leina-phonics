<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1a Lesson 5: ch bridge</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .digraph { color: #e74c3c; font-weight: bold; }
  .vowel { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 1a • Lesson 5</h1>
  <h2>More ch + CVC</h2>
  <p style="text-align:center;">Red = digraph or short vowel.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('chin')"><span class="digraph">ch</span><span class="p1">in</span></div>
    <div class="word" onclick="speak('pet')"><span class="p1">p</span><span class="vowel">e</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('rich')"><span class="p1">ri</span><span class="digraph">ch</span></div>
    <div class="word" onclick="speak('big')"><span class="p1">b</span><span class="vowel">i</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('lunch')"><span class="p1">lun</span><span class="digraph">ch</span></div>
    <div class="word" onclick="speak('run')"><span class="p1">r</span><span class="vowel">u</span><span class="p2">n</span></div>
  </div>
  <h2>Story: Lunch Time</h2>
  <div class="story">
    <p><span class="p1">He has a small </span><span class="digraph">ch</span><span class="p2">in</span><span class="p1">.</span></p>
    <button onclick="speak('He has a small chin.')">Hear sentence 1</button>
    <p><span class="p2">My </span><span class="p1">p</span><span class="vowel">e</span><span class="p2">t</span><span class="p1"> is fun.</span></p>
    <button onclick="speak('My pet is fun.')">Hear sentence 2</button>
    <p><span class="p1">How </span><span class="p2">mu</span><span class="digraph">ch</span><span class="p1"> does it cost?</span></p>
    <button onclick="speak('How much does it cost?')">Hear sentence 3</button>
    <p><span class="p2">We had </span><span class="p1">lun</span><span class="digraph">ch</span><span class="p1"> at school.</span></p>
    <button onclick="speak('We had lunch at school.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the digraph or short vowel. Building on ch with CVC words.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
