<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 7 Lesson 2: Silent wr</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .silent { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  .p3 { color: #f39c12; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 7 • Lesson 2</h1>
  <h2>Silent wr</h2>
  <p style="text-align:center;">Red = silent “w” in wr.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('write')"><span class="silent">w</span><span class="p1">rite</span></div>
    <div class="word" onclick="speak('wrong')"><span class="silent">w</span><span class="p2">rong</span></div>
    <div class="word" onclick="speak('wrist')"><span class="silent">w</span><span class="p1">rist</span></div>
    <div class="word" onclick="speak('wrap')"><span class="silent">w</span><span class="p3">rap</span></div>
    <div class="word" onclick="speak('wreck')"><span class="silent">w</span><span class="p2">reck</span></div>
    <div class="word" onclick="speak('wren')"><span class="silent">w</span><span class="p1">ren</span></div>
  </div>
  <h2>Story: Silent wr</h2>
  <div class="story">
    <p><span class="p1">Please </span><span class="silent">w</span><span class="p2">rite</span><span class="p3"> your name.</span></p>
    <button onclick="speak('Please write your name.')">Hear sentence 1</button>
    <p><span class="p2">That answer is </span><span class="silent">w</span><span class="p1">rong</span><span class="p3">.</span></p>
    <button onclick="speak('That answer is wrong.')">Hear sentence 2</button>
    <p><span class="p3">She hurt her </span><span class="silent">w</span><span class="p2">rist</span><span class="p1">.</span></p>
    <button onclick="speak('She hurt her wrist.')">Hear sentence 3</button>
    <p><span class="p1">Please </span><span class="silent">w</span><span class="p3">rap</span><span class="p2"> the present.</span></p>
    <button onclick="speak('Please wrap the present.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the silent w. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
