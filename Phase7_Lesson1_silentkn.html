<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 7 Lesson 1: Silent kn</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .silent { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  .p3 { color: #f39c12; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 7 • Lesson 1</h1>
  <h2>Silent kn</h2>
  <p style="text-align:center;">Red = silent “k” in kn.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('knee')"><span class="silent">k</span><span class="p1">nee</span></div>
    <div class="word" onclick="speak('knife')"><span class="silent">k</span><span class="p2">nife</span></div>
    <div class="word" onclick="speak('knock')"><span class="silent">k</span><span class="p1">nock</span></div>
    <div class="word" onclick="speak('know')"><span class="silent">k</span><span class="p3">now</span></div>
    <div class="word" onclick="speak('knit')"><span class="silent">k</span><span class="p2">nit</span></div>
    <div class="word" onclick="speak('knot')"><span class="silent">k</span><span class="p1">not</span></div>
  </div>
  <h2>Story: Silent kn</h2>
  <div class="story">
    <p><span class="p1">She hurt her </span><span class="silent">k</span><span class="p2">nee</span><span class="p3">.</span></p>
    <button onclick="speak('She hurt her knee.')">Hear sentence 1</button>
    <p><span class="p2">Please use a sharp </span><span class="silent">k</span><span class="p1">nife</span><span class="p3">.</span></p>
    <button onclick="speak('Please use a sharp knife.')">Hear sentence 2</button>
    <p><span class="p3">I </span><span class="silent">k</span><span class="p2">now</span><span class="p1"> the answer.</span></p>
    <button onclick="speak('I know the answer.')">Hear sentence 3</button>
    <p><span class="p1">Do not </span><span class="silent">k</span><span class="p3">nock</span><span class="p2"> on the door.</span></p>
    <button onclick="speak('Do not knock on the door.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the silent k. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
