<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 9 Lesson 2: Silent l</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .silent { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  .p3 { color: #f39c12; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 9 • Lesson 2</h1>
  <h2>Silent l</h2>
  <p style="text-align:center;">Red = silent “l”.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('calm')"><span class="p1">ca</span><span class="silent">l</span><span class="p2">m</span></div>
    <div class="word" onclick="speak('half')"><span class="p1">ha</span><span class="silent">l</span><span class="p3">f</span></div>
    <div class="word" onclick="speak('walk')"><span class="p2">wa</span><span class="silent">l</span><span class="p1">k</span></div>
    <div class="word" onclick="speak('talk')"><span class="p3">ta</span><span class="silent">l</span><span class="p2">k</span></div>
    <div class="word" onclick="speak('would')"><span class="p1">wou</span><span class="silent">l</span><span class="p3">d</span></div>
    <div class="word" onclick="speak('should')"><span class="p2">shou</span><span class="silent">l</span><span class="p1">d</span></div>
  </div>
  <h2>Story: Silent l</h2>
  <div class="story">
    <p><span class="p1">Please stay </span><span class="p2">ca</span><span class="silent">l</span><span class="p3">m</span><span class="p1">.</span></p>
    <button onclick="speak('Please stay calm.')">Hear sentence 1</button>
    <p><span class="p2">She ate </span><span class="p1">ha</span><span class="silent">l</span><span class="p3">f</span><span class="p2"> the apple.</span></p>
    <button onclick="speak('She ate half the apple.')">Hear sentence 2</button>
    <p><span class="p3">We like to </span><span class="p2">wa</span><span class="silent">l</span><span class="p1">k</span><span class="p3">.</span></p>
    <button onclick="speak('We like to walk.')">Hear sentence 3</button>
    <p><span class="p1">I </span><span class="p2">wou</span><span class="silent">l</span><span class="p3">d</span><span class="p1"> like to talk.</span></p>
    <button onclick="speak('I would like to talk.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the silent l. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
