<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 Lesson 12: -ig family</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .vowel { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 1 • Lesson 12</h1>
  <h2>-ig family</h2>
  <p style="text-align:center;">Red = short i.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('big')"><span class="p1">b</span><span class="vowel">i</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('pig')"><span class="p1">p</span><span class="vowel">i</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('dig')"><span class="p1">d</span><span class="vowel">i</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('wig')"><span class="p1">w</span><span class="vowel">i</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('fig')"><span class="p1">f</span><span class="vowel">i</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('jig')"><span class="p1">j</span><span class="vowel">i</span><span class="p2">g</span></div>
  </div>
  <h2>Story: The Big Pig</h2>
  <div class="story">
    <p><span class="p1">The </span><span class="p1">p</span><span class="vowel">i</span><span class="p2">g</span><span class="p1"> is very big.</span></p>
    <button onclick="speak('The pig is very big.')">Hear sentence 1</button>
    <p><span class="p2">We will </span><span class="p1">d</span><span class="vowel">i</span><span class="p2">g</span><span class="p1"> a hole for the plant.</span></p>
    <button onclick="speak('We will dig a hole for the plant.')">Hear sentence 2</button>
    <p><span class="p1">She wore a funny </span><span class="p1">w</span><span class="vowel">i</span><span class="p2">g</span><span class="p1">.</span></p>
    <button onclick="speak('She wore a funny wig.')">Hear sentence 3</button>
    <p><span class="p2">I like to eat a sweet </span><span class="p1">f</span><span class="vowel">i</span><span class="p2">g</span><span class="p1">.</span></p>
    <button onclick="speak('I like to eat a sweet fig.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the short vowel. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
