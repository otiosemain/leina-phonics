<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 10 Lesson 1: Prefix un-</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .prefix { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  .p3 { color: #f39c12; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 10 • Lesson 1</h1>
  <h2>Prefix un-</h2>
  <p style="text-align:center;">Red = “un-”.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('unhappy')"><span class="prefix">un</span><span class="p1">happy</span></div>
    <div class="word" onclick="speak('unlock')"><span class="prefix">un</span><span class="p2">lock</span></div>
    <div class="word" onclick="speak('unsafe')"><span class="prefix">un</span><span class="p3">safe</span></div>
    <div class="word" onclick="speak('untie')"><span class="prefix">un</span><span class="p1">tie</span></div>
    <div class="word" onclick="speak('undo')"><span class="prefix">un</span><span class="p2">do</span></div>
    <div class="word" onclick="speak('unclear')"><span class="prefix">un</span><span class="p3">clear</span></div>
  </div>
  <h2>Story: Prefix un-</h2>
  <div class="story">
    <p><span class="p1">She is </span><span class="prefix">un</span><span class="p2">happy</span><span class="p3">.</span></p>
    <button onclick="speak('She is unhappy.')">Hear sentence 1</button>
    <p><span class="p2">Please </span><span class="prefix">un</span><span class="p1">lock</span><span class="p3"> the door.</span></p>
    <button onclick="speak('Please unlock the door.')">Hear sentence 2</button>
    <p><span class="p3">That is </span><span class="prefix">un</span><span class="p1">safe</span><span class="p2">.</span></p>
    <button onclick="speak('That is unsafe.')">Hear sentence 3</button>
    <p><span class="p1">Can you </span><span class="prefix">un</span><span class="p2">tie</span><span class="p3"> the knot?</span></p>
    <button onclick="speak('Can you untie the knot?')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the prefix. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
