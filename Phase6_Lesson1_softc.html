<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 6 Lesson 1: Soft c</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .soft { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  .p3 { color: #f39c12; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 6 • Lesson 1</h1>
  <h2>Soft c</h2>
  <p style="text-align:center;">Red = soft “c” (sounds like s).</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('ice')"><span class="p1">i</span><span class="soft">c</span><span class="p2">e</span></div>
    <div class="word" onclick="speak('city')"><span class="soft">c</span><span class="p1">ity</span></div>
    <div class="word" onclick="speak('face')"><span class="p2">fa</span><span class="soft">c</span><span class="p1">e</span></div>
    <div class="word" onclick="speak('nice')"><span class="p1">ni</span><span class="soft">c</span><span class="p3">e</span></div>
    <div class="word" onclick="speak('place')"><span class="p2">pla</span><span class="soft">c</span><span class="p1">e</span></div>
    <div class="word" onclick="speak('circle')"><span class="soft">c</span><span class="p1">ir</span><span class="soft">c</span><span class="p2">le</span></div>
  </div>
  <h2>Story: Soft c</h2>
  <div class="story">
    <p><span class="p1">The </span><span class="soft">i</span><span class="soft">c</span><span class="p2">e</span><span class="p3"> is cold.</span></p>
    <button onclick="speak('The ice is cold.')">Hear sentence 1</button>
    <p><span class="p2">We live in a big </span><span class="soft">c</span><span class="p1">ity</span><span class="p3">.</span></p>
    <button onclick="speak('We live in a big city.')">Hear sentence 2</button>
    <p><span class="p3">She has a </span><span class="p1">ni</span><span class="soft">c</span><span class="p2">e</span><span class="p1"> face.</span></p>
    <button onclick="speak('She has a nice face.')">Hear sentence 3</button>
    <p><span class="p1">Please sit in a </span><span class="soft">c</span><span class="p2">ircle</span><span class="p3">.</span></p>
    <button onclick="speak('Please sit in a circle.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the soft c. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
