<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 8 Lesson 1: Silent h</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .silent { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  .p3 { color: #f39c12; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 8 • Lesson 1</h1>
  <h2>Silent h</h2>
  <p style="text-align:center;">Red = silent “h”.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('hour')"><span class="silent">h</span><span class="p1">our</span></div>
    <div class="word" onclick="speak('honest')"><span class="silent">h</span><span class="p2">onest</span></div>
    <div class="word" onclick="speak('ghost')"><span class="p1">g</span><span class="silent">h</span><span class="p2">ost</span></div>
    <div class="word" onclick="speak('rhyme')"><span class="p1">r</span><span class="silent">h</span><span class="p3">yme</span></div>
    <div class="word" onclick="speak('what')"><span class="p2">w</span><span class="silent">h</span><span class="p1">at</span></div>
    <div class="word" onclick="speak('when')"><span class="p3">w</span><span class="silent">h</span><span class="p2">en</span></div>
  </div>
  <h2>Story: Silent h</h2>
  <div class="story">
    <p><span class="p1">It is one </span><span class="silent">h</span><span class="p2">our</span><span class="p3"> later.</span></p>
    <button onclick="speak('It is one hour later.')">Hear sentence 1</button>
    <p><span class="p2">Please be </span><span class="silent">h</span><span class="p1">onest</span><span class="p3">.</span></p>
    <button onclick="speak('Please be honest.')">Hear sentence 2</button>
    <p><span class="p3">I saw a </span><span class="p1">g</span><span class="silent">h</span><span class="p2">ost</span><span class="p1">.</span></p>
    <button onclick="speak('I saw a ghost.')">Hear sentence 3</button>
    <p><span class="p1">She likes to </span><span class="p2">r</span><span class="silent">h</span><span class="p3">yme</span><span class="p2">.</span></p>
    <button onclick="speak('She likes to rhyme.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the silent h. Other colours change so neighbouring parts look different.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
