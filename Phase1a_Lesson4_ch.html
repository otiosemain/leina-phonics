<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1a Lesson 4: ch bridge</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #fffef5; margin: 16px; font-size: 20px; color: #222; }
  h1, h2 { text-align: center; }
  .word { display: inline-block; margin: 8px; padding: 12px 16px; border-radius: 12px; background: white; border: 2px solid #ddd; cursor: pointer; font-size: 26px; }
  .digraph { color: #e74c3c; font-weight: bold; }
  .vowel { color: #e74c3c; font-weight: bold; }
  .p1 { color: #3498db; font-weight: bold; }
  .p2 { color: #27ae60; font-weight: bold; }
  button { margin: 6px; padding: 8px 14px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .story { text-align: center; margin: 20px 0; line-height: 1.7; }
  .practice { margin-top: 20px; font-size: 16px; text-align: center; color: #555; }
</style>
</head>
<body>
  <h1>Phase 1a • Lesson 4</h1>
  <h2>Bridge: ch + CVC</h2>
  <p style="text-align:center;">Red = digraph or short vowel.</p>
  <h2>Flashcards</h2>
  <div style="text-align:center;">
    <div class="word" onclick="speak('chip')"><span class="digraph">ch</span><span class="p1">ip</span></div>
    <div class="word" onclick="speak('cat')"><span class="p1">c</span><span class="vowel">a</span><span class="p2">t</span></div>
    <div class="word" onclick="speak('chat')"><span class="digraph">ch</span><span class="p2">at</span></div>
    <div class="word" onclick="speak('dog')"><span class="p1">d</span><span class="vowel">o</span><span class="p2">g</span></div>
    <div class="word" onclick="speak('much')"><span class="p1">mu</span><span class="digraph">ch</span></div>
    <div class="word" onclick="speak('sun')"><span class="p1">s</span><span class="vowel">u</span><span class="p2">n</span></div>
  </div>
  <h2>Story: Chips for Lunch</h2>
  <div class="story">
    <p><span class="p1">We had </span><span class="digraph">ch</span><span class="p2">ips</span><span class="p1"> for lunch.</span></p>
    <button onclick="speak('We had chips for lunch.')">Hear sentence 1</button>
    <p><span class="p2">The </span><span class="p1">c</span><span class="vowel">a</span><span class="p2">t</span><span class="p1"> is soft.</span></p>
    <button onclick="speak('The cat is soft.')">Hear sentence 2</button>
    <p><span class="p1">Mum likes to </span><span class="digraph">ch</span><span class="p2">at</span><span class="p1">.</span></p>
    <button onclick="speak('Mum likes to chat.')">Hear sentence 3</button>
    <p><span class="p2">The </span><span class="p1">d</span><span class="vowel">o</span><span class="p2">g</span><span class="p1"> runs in the sun.</span></p>
    <button onclick="speak('The dog runs in the sun.')">Hear sentence 4</button>
  </div>
  <div class="practice">Red marks the digraph or short vowel. Introducing ch with known CVC.</div>
  <script>
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9; u.pitch = 1.1;
        window.speechSynthesis.speak(u);
      }
    }
  </script>
</body>
</html>
